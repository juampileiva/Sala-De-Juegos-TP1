<header class="barra">
  <button type="button" class="marca boton-marca" (click)="navegar('/')">
    <img src="/favicon.jpg" alt="Logo Sala de Juegos" />
    <span>Sala de Juegos</span>
  </button>

  <div class="acciones-header">
    <div class="usuario" *ngIf="estaLogueado">
      <span>{{ nombreUsuario }}</span>
    </div>

    <div class="usuario cerrando" *ngIf="cerrandoSesion">
      <span>Cerrando sesión...</span>
    </div>

    <div class="menu-contenedor">
      <button type="button" class="boton-menu" (click)="toggleMenu()" [disabled]="cerrandoSesion">
        <span class="icono-menu">☰</span>
        <span>Menú</span>
      </button>

      <nav class="menu-desplegable" *ngIf="menuAbierto">
        <button type="button" (click)="navegar('/')">Inicio</button>
        <button type="button" (click)="navegar('/quien-soy')">Quién soy</button>

        <ng-container *ngIf="estaLogueado">
          <div class="separador"></div>

          <button type="button" (click)="navegar('/ahorcado')">Ahorcado</button>
          <button type="button" (click)="navegar('/mayor-menor')">Mayor o menor</button>
          <button type="button" (click)="navegar('/preguntados')">Preguntados</button>
          <button type="button" (click)="navegar('/no-explotes')">No explotes</button>
          <button type="button" (click)="navegar('/resultados')">Resultados</button>
          <button type="button" (click)="navegar('/chat')">Chat</button>

          <div class="separador"></div>

          <button type="button" class="cerrar-sesion" (click)="cerrarSesion($event)">
            Cerrar sesión
          </button>
        </ng-container>

        <ng-container *ngIf="!estaLogueado">
          <div class="separador"></div>

          <button type="button" (click)="navegar('/login')">Iniciar sesión</button>
          <button type="button" (click)="navegar('/registro')">Registro</button>
        </ng-container>
      </nav>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
